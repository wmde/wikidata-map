<!doctype html>
<html lang="en">
<head>
    <title>Wikidata Map</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="./css.css">
</head>
<body>
<input type="checkbox" id="configToggle" checked>
<label id="configToggleLabel" for="configToggle"></label>
<div id="controls">
    <div class="controls-header">
        <h2>Wikidata Map</h2>
    </div>
    
    <div class="control-section">
        <label class="control-header">Snapshot Date</label>
        <div class="date-slider-container">
            <input type="range" id="dateSlider" min="0" max="10" value="10" class="date-slider">
            <div class="date-value-container">
                <span id="dateValue" class="date-value">2025-10-13</span>
            </div>
        </div>
    </div>

    <div class="control-section">
        <label class="control-header">Layers</label>
        <form id="layerSelector" class="layer-grid">
            <label class="checkbox-label"><input type="checkbox" name="layer-items" value="1" checked/><span>Items</span></label>
            <label class="checkbox-label"><input type="checkbox" name="layer-P17" value="1"/><span>Country</span></label>
            <label class="checkbox-label"><input type="checkbox" name="layer-P36" value="1"/><span>Capital</span></label>
            <label class="checkbox-label"><input type="checkbox" name="layer-P47" value="1"/><span>Shares Border</span></label>
            <label class="checkbox-label"><input type="checkbox" name="layer-P138" value="1"/><span>Named After</span></label>
            <label class="checkbox-label"><input type="checkbox" name="layer-P150" value="1"/><span>Admin Entity</span></label>
            <label class="checkbox-label"><input type="checkbox" name="layer-P190" value="1"/><span>Twinned Admin</span></label>
            <label class="checkbox-label"><input type="checkbox" name="layer-P197" value="1"/><span>Adjacent Station</span></label>
            <label class="checkbox-label"><input type="checkbox" name="layer-P403" value="1"/><span>Watercourse Mouth</span></label>
        </form>
    </div>

    <div class="control-section">
        <label class="control-header">Item Intensity</label>
        <div class="intensity-slider-container">
            <input type="range" id="intensitySlider" min="1" max="100" value="5" class="intensity-slider">
            <span id="intensityValue" class="intensity-value">5</span>
        </div>
    </div>

    <div class="info-section">
        <p><strong>💡 Tip:</strong> Click the map to zoom in 4x.</p>
        <p><strong>📋 Legend:</strong> Colored pixels represent Wikidata items at different locations.</p>
        <p style="margin-top: 1rem; font-size: 0.85rem; opacity: 0.8;">CC0 Data & Visualization. Code on <a href="https://github.com/wmde/wikidata-map">GitHub</a>.</p>
    </div>
</div>
<!--This is needed when we are using the build step again: <script src="main.js"></script>-->
<script type="module" src="../src/index.js"></script>
<div id="canvas-container" class="zoomable" style="position: relative;">
</div>
</body>
</html>
